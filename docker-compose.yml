version: '3.8'

services:
  # Servidor Web (Nginx)
  web:
    image: nginx:alpine
    container_name: crm-web-v2
    restart: always
    ports:
      - "8011:80"                      # Mapeia a porta externa 8011 para a 80 (HTTP) do Nginx
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - crm-app-v2
      - crm-api-v2

  # Frontend (React/Vite)
  crm-app-v2:
    image: node:20-alpine
    container_name: crm-frontend-v2
    restart: always
    environment:
      - NODE_ENV=development
      - PORT=8000
      - DATABASE_URL=postgresql://postgres:redetv@db-v2:5432/crm_redetv
    volumes:
      - .:/usr/src/app
    working_dir: /usr/src/app
    command: >
      sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 8000"
    depends_on:
      - db-v2

  # Backend (API Node)
  crm-api-v2:
    image: node:20-alpine
    container_name: crm-api-v2
    restart: always
    environment:
      - API_PORT=8001
      - DATABASE_URL=postgresql://postgres:redetv@db-v2:5432/crm_redetv
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - ./backend:/usr/src/app
    working_dir: /usr/src/app
    command: >
      sh -c "npm install && npm start"
    depends_on:
      - db-v2

  # Banco de Dados PostgreSQL
  db-v2:
    image: postgres:15-alpine
    container_name: crm-db-v2
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=redetv
      - POSTGRES_DB=crm_redetv
    volumes:
      - ./crm-redetv-schema-completo.sql:/docker-entrypoint-initdb.d/1-schema.sql:ro
      - crm-db-data-v2:/var/lib/postgresql/data

volumes:
  crm-db-data-v2: